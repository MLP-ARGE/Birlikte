include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Tasarım tokenlarını atlayıp ham değer yazmayı yakalamak için
    # uyarıları hata seviyesine çekiyoruz.
    unused_import: error
    unused_local_variable: error
    dead_code: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_declarations
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters
